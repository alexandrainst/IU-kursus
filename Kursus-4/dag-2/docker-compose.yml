services:
  juice-shop:
    image: bkimminich/juice-shop:latest
    container_name: juiceshop
    restart: unless-stopped
    ports:
      - "80:3000"
    environment:
      - NODE_ENV=unsafe
    volumes:
      - juice_data:/juice-shop/data

  juice-proxy:
    image: nginx:alpine
    container_name: juice-proxy
    ports:
      - "3010:80"
    volumes:
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./logs:/var/log/nginx
    depends_on:
      - juice-shop

  juice-waf:
    image: owasp/modsecurity-crs:nginx
    container_name: juice-waf
    user: root
    ports:
      - "3020:8080"
    environment:
      BACKEND: http://juice-shop:3000
      ERRORLOG: "/var/log/waf/error.log"
      ACCESSLOG: "/var/log/waf/access.log"
      MODSEC_AUDIT_LOG_FORMAT: Native
      MODSEC_AUDIT_LOG_TYPE: Serial
      MODSEC_AUDIT_LOG: "/var/log/waf/modsec_audit.log"
    volumes:
      - ./logs-waf/:/var/log/waf
      - ./exclusions.conf:/etc/modsecurity.d/owasp-crs/rules/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf:ro
    depends_on:
      - juice-shop
volumes:
  juice_data:
